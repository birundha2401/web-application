<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web Application Boilerplate</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Welcome Back</h1>
            <p class="subtitle">Please log in to your account.</p>
        </header>

        <main class="main-content">
            <div class="card">
                <form id="login-form" class="form-container">
                    <div id="form-message" class="message hidden"></div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-full">Login</button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="register.html">Register here</a></p><br>
                    <a href="index.html">← Back to Home</a>
                </div>
            </div>
        </main>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
