<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js Projects Visualization Bar Chart</title>
    <!-- D3.js Version 7 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fafafa;
        }
        h1 {
            color: #2c3e50;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        .bar {
            fill: #3498db;
            transition: fill 0.2s ease;
        }
        .bar:hover {
            fill: #e67e22;
        }
        .value {
            font-size: 13px;
            font-weight: bold;
            fill: #2c3e50;
        }
        .axis-label {
            font-size: 14px;
            font-weight: bold;
            fill: #34495e;
        }
        .axis text {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Technology Domains - Number of Completed Projects</h1>
    <svg width="720" height="480"></svg>
    <script>
        const svg = d3.select("svg");
        const width = 720;
        const height = 480;
        const margin = { top: 40, right: 30, bottom: 80, left: 70 };

        d3.csv("data/d3_projects_data.csv").then(function(data) {
            data.forEach(function(d) {
                d.Project_Count = +d.Project_Count;
            });

            const x = d3.scaleBand()
                .domain(data.map(d => d.Category))
                .range([margin.left, width - margin.right])
                .padding(0.35);

            const y = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.Project_Count) * 1.15])
                .nice()
                .range([height - margin.bottom, margin.top]);

            svg.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(0, ${height - margin.bottom})`)
                .call(d3.axisBottom(x))
                .selectAll("text")
                .style("text-anchor", "middle");

            svg.append("g")
                .attr("class", "axis")
                .attr("transform", `translate(${margin.left}, 0)`)
                .call(d3.axisLeft(y));

            svg.selectAll(".bar")
                .data(data)
                .enter()
                .append("rect")
                .attr("class", "bar")
                .attr("x", d => x(d.Category))
                .attr("y", d => y(d.Project_Count))
                .attr("width", x.bandwidth())
                .attr("height", d => (height - margin.bottom) - y(d.Project_Count));

            svg.selectAll(".value")
                .data(data)
                .enter()
                .append("text")
                .attr("class", "value")
                .attr("x", d => x(d.Category) + x.bandwidth() / 2)
                .attr("y", d => y(d.Project_Count) - 8)
                .attr("text-anchor", "middle")
                .text(d => d.Project_Count);

            svg.append("text")
                .attr("class", "axis-label")
                .attr("x", width / 2)
                .attr("y", height - 20)
                .attr("text-anchor", "middle")
                .text("Technology Category");

            svg.append("text")
                .attr("class", "axis-label")
                .attr("transform", "rotate(-90)")
                .attr("x", -(height / 2))
                .attr("y", 25)
                .attr("text-anchor", "middle")
                .text("Number of Projects");
        }).catch(function(err) {
            console.error("Error loading CSV:", err);
        });
    </script>
</body>
</html>
